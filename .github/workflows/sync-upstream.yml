name: Sync Upstream MediaWiki Pages

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync upstream MediaWiki pages to repo
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and apply upstream pages
        run: node scripts/sync-upstream.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/ templates/ mediawiki/
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(sync): update upstream modules, templates, and mediawiki pages"
            git push
          fi
