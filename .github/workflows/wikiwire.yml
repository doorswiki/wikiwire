name: WikiWire

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'modules/*'
      - 'templates/**'
      - 'templates/*'
      - 'mediawiki/**'
      - 'mediawiki/*'
      - 'pages/**'
      - 'pages/*'
      - 'users/**'
      - 'users/*'
      - 'user_talk/**'
      - 'user_talk/*'
  workflow_dispatch:

jobs:
  wikiwire:
    runs-on: ubuntu-latest
    name: Sync upstream MediaWiki and deploy to production wikis
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and apply upstream pages
        continue-on-error: true
        env:
          WIKI_USERNAME: DoorsWiki@WikiWire
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
        run: node scripts/sync-upstream.mjs

      - name: Commit and push changes
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/ templates/ mediawiki/ pages/ users/ user_talk/ scripts/pages.json
          if git diff --staged --quiet; then
            echo "No upstream changes detected in repository."
          else
            git commit -m "chore(sync): update upstream wiki pages"
            git push
          fi

      # push events: incremental sync with deletion handling. The sync above commits
      # the move/delete follow-through, so this push sees the files that disappeared
      # and `delete_removed: true` removes the matching fork pages.
      - name: Sync files to production MediaWiki (changed files, follows deletions)
        if: github.event_name == 'push'
        uses: doorswiki/wikiwire@main
        with:
          delete_removed: true
          username: DoorsWiki@WikiWire
          password: ${{ secrets.WIKI_PASSWORD }}

      # Scheduled / manual runs have no commit diff, so do a full sync instead;
      # deletions are propagated by the push-triggered run the sync above creates.
      - name: Sync files to production MediaWiki (full sync)
        if: github.event_name != 'push'
        uses: doorswiki/wikiwire@main
        with:
          sync_all: override
          username: DoorsWiki@WikiWire
          password: ${{ secrets.WIKI_PASSWORD }}