name: WikiWire

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'modules/*'
      - 'templates/**'
      - 'templates/*'
      - 'mediawiki/**'
      - 'mediawiki/*'
      - 'pages/**'
      - 'pages/*'
      - 'users/**'
      - 'users/*'
      - 'user_talk/**'
      - 'user_talk/*'
  workflow_dispatch:

jobs:
  wikiwire:
    runs-on: ubuntu-latest
    name: Sync upstream MediaWiki and deploy to production wikis
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and apply upstream pages
        continue-on-error: true
        env:
          WIKI_USERNAME: DoorsWiki@WikiWire
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
        run: node scripts/sync-upstream.mjs

      - name: Commit and push changes
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/ templates/ mediawiki/ pages/ users/ user_talk/
          if git diff --staged --quiet; then
            echo "No upstream changes detected in repository."
          else
            git commit -m "chore(sync): update upstream wiki pages"
            git push
          fi

      - name: Sync files to production MediaWiki
        uses: doorswiki/wikiwire@main
        with:
          sync_all: override
          username: DoorsWiki@WikiWire
          password: ${{ secrets.WIKI_PASSWORD }}