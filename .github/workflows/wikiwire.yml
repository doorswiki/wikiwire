name: WikiWire

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'modules/*'
      - 'templates/**'
      - 'templates/*'
      - 'mediawiki/**'
      - 'mediawiki/*'
      - 'pages/**'
      - 'pages/*'
      - 'users/**'
      - 'users/*'
      - 'user_talk/**'
      - 'user_talk/*'
      # Code/manifest changes should also run the sync so a pending or failed
      # deploy is retried immediately.
      - 'scripts/**'
      - '.github/workflows/wikiwire.yml'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional one-off base commit (overrides the wikiwire-deployed tag, e.g. to backfill changes that were committed but never deployed)'
        required: false
        default: ''

# Serialize runs: the deploy tag below is force-updated, and two concurrent
# deploys could otherwise race with each other.
concurrency:
  group: wikiwire
  cancel-in-progress: false

jobs:
  wikiwire:
    runs-on: ubuntu-latest
    name: Sync upstream MediaWiki and deploy to production wikis
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Remember where the deploy should start from before the import below
      # adds its own commit. Prefer the last revision this workflow successfully
      # deployed (`wikiwire-deployed` tag), so scheduled/manual runs pick up
      # changes that were committed but never made it to the wikis (for example
      # after a failed deploy, or when the import commit's push did not trigger
      # this workflow).
      - name: Record sync base
        id: sync_base
        env:
          BASE_SHA_INPUT: ${{ inputs.base_sha }}
        run: |
          override="$BASE_SHA_INPUT"
          deployed="$(git rev-parse --verify --quiet refs/tags/wikiwire-deployed || true)"
          if [ -n "$override" ]; then
            echo "sha=$override" >> "$GITHUB_OUTPUT"
            echo "tag_ok=true" >> "$GITHUB_OUTPUT"
            echo "Deploying the explicit base range starting at $override."
          elif [ -n "$deployed" ]; then
            echo "sha=$deployed" >> "$GITHUB_OUTPUT"
            echo "tag_ok=true" >> "$GITHUB_OUTPUT"
            echo "Deploying changes since the last successful deploy ($deployed)."
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "tag_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No wikiwire-deployed tag found; deploying only this push. Dispatch with base_sha once to backfill older changes and create the tag."
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "tag_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No wikiwire-deployed tag found; this run has no pending range to deploy. Pass the base_sha input to backfill."
          fi

      - name: Fetch and apply upstream pages
        id: upstream
        continue-on-error: true
        env:
          WIKI_USERNAME: DoorsWiki@WikiWire
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
        run: node scripts/sync-upstream.mjs

      - name: Commit and push changes
        id: commit
        if: steps.upstream.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- modules/ templates/ mediawiki/ pages/ users/ user_talk/ scripts/pages.json
          if git diff --staged --quiet; then
            echo "No upstream changes detected in repository."
            exit 0
          fi
          git commit -m "chore(sync): update upstream wiki pages"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed upstream sync commit."
              exit 0
            fi
            echo "Push failed (attempt $attempt/3); rebasing on origin and retrying..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || { git rebase --abort || true; }
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push the upstream sync commit after 3 attempts."
          exit 1

      # Deploy the whole range from the recorded base to the current HEAD, so
      # the import commit made above is included and deleted files are seen.
      # The recorded base is the last successfully deployed revision, so this
      # also covers work committed by earlier runs or by a failed deploy.
      - name: Sync files to production MediaWiki
        if: always() && !cancelled()
        uses: doorswiki/wikiwire@main
        with:
          base_sha: ${{ steps.sync_base.outputs.sha }}
          delete_removed: true
          username: DoorsWiki@WikiWire
          password: ${{ secrets.WIKI_PASSWORD }}

      # Only advance the deploy tag when every page in the range succeeded, so a
      # partial failure is retried by the next run instead of being skipped.
      # A queued run for an older commit must not move the tag backwards.
      - name: Record deployed revision
        if: success() && steps.sync_base.outputs.tag_ok == 'true'
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          git fetch --force origin refs/tags/wikiwire-deployed:refs/tags/wikiwire-deployed || true
          current="$(git rev-parse --verify --quiet refs/tags/wikiwire-deployed || true)"
          if [ -n "$current" ] && [ "$current" != "$head" ] && git merge-base --is-ancestor "$head" "$current"; then
            echo "::warning::Not advancing wikiwire-deployed: $head is older than $current."
            exit 0
          fi
          git tag -f wikiwire-deployed "$head"
          git push --force origin refs/tags/wikiwire-deployed

      # `continue-on-error` keeps the deploy running even when the import or the
      # push fails, but the run must still report that failure.
      - name: Report upstream sync failures
        if: steps.upstream.outcome == 'failure' || steps.commit.outcome == 'failure'
        run: |
          echo "::error::Upstream import or commit/push failed; see the steps above."
          exit 1