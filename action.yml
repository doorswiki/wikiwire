name: WikiWire
description: Sync your Git repositories with your live on-wiki MediaWiki modules, templates, and MediaWiki configuration pages
branding:
  icon: upload-cloud
  color: blue

inputs:
  username:
    description: Default bot username for all sites (Special:BotPasswords recommended with User@BotUser). Optional if every site that needs sync has an entry in site_credentials.
    required: false
    default: ""
  password:
    description: Default bot password for all sites. Optional if every site that needs sync has an entry in site_credentials.
    required: false
    default: ""
  site_credentials:
    description: Optional JSON object mapping wikiwire.toml site id to {"username":"...","password":"..."} for per-wiki credentials in one workflow
    required: false
    default: ""
  config_path:
    description: Path to wikiwire.toml relative to the repository root
    required: false
    default: wikiwire.toml
  ignore_path:
    description: Path to .wikiwireignore relative to the repository root (optional file)
    required: false
    default: .wikiwireignore
  dry_run:
    description: If true, log edits/deletes only and do not call the MediaWiki API
    required: false
    default: "false"
  delete_removed:
    description: If true, delete on-wiki pages when corresponding repo files are removed. Removing a whole site or shared directory is skipped as a reorganization. Requires special permissions.
    required: false
    default: "false"
  sync_all:
    description: If set to "override", check and sync every file under modules/, templates/, mediawiki/, pages/, users/, and user_talk/ from the workspace on every run instead of only the files changed in the commit range. Combine with base_sha so the previous revision can still serve as the three-way merge ancestor and deleted files can be detected. Use for workflow_dispatch, PRs, or periodic full syncs.
    required: false
    default: "false"
  base_sha:
    description: Base commit for the incremental change list. Defaults to the push event's before SHA. Set this when the workflow modifies the repository before deploying (for example, an upstream import commit), so the deploy covers the whole range.
    required: false
    default: ""
  head_sha:
    description: Head commit for the incremental change list. Defaults to the push event's after SHA, or to the local HEAD when base_sha is set.
    required: false
    default: ""

runs:
  using: node20
  main: dist/index.js
